# Desktop and laptop identities. ~/.webscout/identities/*.toml is what webscout loads;
# it's seeded from these files on first run, so edit/add/remove devices there.
#
# name        unique id, also matched by identity specs ("macbook", "rtx")
# kind        desktop | phone | tablet
# os          windows | macos | linux | android | ios
# os_version  what UA client hints report as platformVersion
# browsers    picked at random; repeat an entry to weight it
# screen      CSS pixels [width, height]; dpr = device pixel ratio
# cpu_cores   navigator.hardwareConcurrency (logical cores)
# ram_gb      real RAM; Chromium reports navigator.deviceMemory capped at 8
# gpu         the unmasked WebGL vendor/renderer *Chrome* reports on this machine
#             (Firefox and Safari variants are derived from it)
# arch        x86 | arm (UA client hints)

[[device]]
name = "win-desktop-rtx3060"
kind = "desktop"
vendor = "Custom"
os = "windows"
os_version = "15.0.0"
browsers = ["chrome", "chrome", "chrome", "edge", "firefox", "opera", "brave"]
screen = [1920, 1080]
dpr = 1.0
cpu_cores = 12
ram_gb = 16
arch = "x86"
gpu = { vendor = "Google Inc. (NVIDIA)", renderer = "ANGLE (NVIDIA, NVIDIA GeForce RTX 3060 (0x00002504) Direct3D11 vs_5_0 ps_5_0, D3D11)" }

