# Tablet identities. Same fields as pcs.toml. iPadOS Safari requests desktop sites by
# default, so an iPad sends the macOS Safari user agent and gives itself away only through
# touch points and screen size — exactly like a real one.

[[device]]
name = "ipad-pro-11-m4"
kind = "tablet"
vendor = "Apple"
os = "ios"
os_version = "26.0.0"
browsers = ["safari"]
screen = [834, 1210]
dpr = 2.0
cpu_cores = 10
ram_gb = 8
touch = 5
arch = "arm"
gpu = { vendor = "Apple Inc.", renderer = "Apple GPU" }

