# Phone identities. Same fields as pcs.toml. Chrome on Android hides the model in its
# user agent ("Android 10; K"), so model / os_version surface only through client hints
# (navigator.userAgentData) — the screen, dpr and GPU are what tell devices apart.
# iOS browsers are all WebKit; only Safari is offered there.

[[device]]
name = "galaxy-s25-ultra"
kind = "phone"
vendor = "Samsung"
model = "SM-S938B"
os = "android"
os_version = "15.0.0"
browsers = ["chrome", "chrome", "chrome", "firefox", "brave"]
screen = [384, 832]
dpr = 2.8125
cpu_cores = 8
ram_gb = 12
touch = 5
arch = "arm"
gpu = { vendor = "Qualcomm", renderer = "Adreno (TM) 830" }

