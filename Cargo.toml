[package]
name = "webscout"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "net", "signal", "process", "sync"] }
cookie_store = "0.21"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
bytes = "1.0"
http = "1.0"
url = "2.0"
thiserror = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
tracing-subscriber = "0.3.23"
scraper = "0.29.0"
axum = { version = "0.8", features = ["macros"] }
rquickjs = { version = "0.14.0", features = ["loader"] }
wreq = { version = "=6.0.0-rc.31", features = ["gzip", "brotli", "deflate", "zstd", "cookies", "json", "form", "socks", "ws"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-serde", "emulation-compression"] }
toml = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rsa = "0.9"
pbkdf2 = "0.12"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "jwk"] }
